name: 'regular artifacts cleanup'
on:
  # TEMPORARILY DISABLED during active development — the weekly scheduled cleanup is paused.
  # Re-enable by uncommenting the schedule: block below.
  # schedule:
  #   - cron: '0 1 * * 0' # weekly at 1 am UTC
  workflow_dispatch:

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: kolpav/purge-artifacts-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          expire-in: 7days # Set this to 0 to delete all artifacts
