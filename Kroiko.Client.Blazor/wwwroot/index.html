<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kroiko</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="fonts/roboto.css" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script>
        {
            // Before anything paints, the theme the app will start in, so the loading screen is in it too (ADR-0014 §3).
            // The rules of LocalStorageThemeStore: "light" and "dark" are picks, anything else follows the system.
            let mode = null;
            try {
                mode = localStorage.getItem('kroiko.theme');
            } catch {
                // Storage can be disabled or blocked; follow the system.
            }
            const dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        }
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        {
            // The template's registration; js/updates.js watches it for new versions (ADR-0002 §1, §4).
            const registering = navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
            import('./js/updates.js')
                .then(updates => updates.start(registering))
                .catch(error => console.error('The app cannot watch for new versions.', error));
        }
    </script>
</body>

</html>
